[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "AI-агент для автоматизации поиска работы"
authors = [{ name = "alxn19", email = "alxn19@yandex.ru" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain (>=1.5.0,<2.0.0)",
    "langchain-openai (>=1.8.0,<2.0.0)",
    "langgraph (>=1.2.21,<2.0.0)",
    "langsmith (>=0.14.17,<0.15.0)",
    "telethon (>=1.45.0,<2.0.0)",
    "python-telegram-bot (>=22.8,<23.0)",
    "google-api-python-client (>=2.202.0,<3.0.0)",
    "google-auth-oauthlib (>=1.5.0,<2.0.0)",
    "google-auth-httplib2 (>=0.4.4,<0.5.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pypdf (>=7.1.0,<8.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
